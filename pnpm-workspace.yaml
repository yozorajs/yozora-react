packages:
  - 'packages/*'
  - 'renderers/*'
verifyDepsBeforeRun: false
autoInstallPeers: true
strictPeerDependencies: false
nodeLinker: isolated
linkWorkspacePackages: true
resolvePeersFromWorkspaceRoot: true
overrides:
  react: 19.3.0
  react-dom: 19.3.0
minimumReleaseAgeExclude:
  - '@yozora/ast@2.4.1'
allowBuilds:
  '@parcel/watcher': false
